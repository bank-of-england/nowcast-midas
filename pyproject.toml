[project]
name = "nowcast-midas"
version = "0.0.3"

description = "Staggered-Combination MIDAS model"

authors = [
    {name="James Kensett", email="James.Kensett@bankofengland.co.uk"},
    {name="Paul Labonne", email="Paul.Labonne@bankofengland.co.uk"},
    {name="Andre Moreira", email="Andre.Moreira@bankofengland.co.uk"},
]

maintainers = [
    {name="James Kensett", email="James.Kensett@bankofengland.co.uk"},
    {name="Paul Labonne", email="Paul.Labonne@bankofengland.co.uk"},
]

license = "MIT"
license-files = ["LICENSE"]

readme = "README.md"

requires-python = ">=3.10"

dependencies = [
    "numpy",
    "jax",
    "scipy",
    "matplotlib",
    "pandas",
    "tqdm",
]

[project.optional-dependencies]
docs = [
    "zensical",
    "mkdocstrings[python]",
]

dev = [
    "nowcast-midas[docs]",
    "conventional-pre-commit>=4.4.0",
    "pre-commit",
    "pydoclint",
    "ruff",
    "pytest",
]

realtime = [
    "forecast-realtime >= 0.5.3",
    "news_decomp >= 0.0.7",
]

[project.urls]
Homepage = "https://github.com/bank-of-england/nowcast-midas"
Documentation = "https://bank-of-england.github.io/nowcast-midas/"
Repository = "https://github.com/bank-of-england/nowcast-midas"
Issues = "https://github.com/bank-of-england/nowcast-midas/issues"
Changelog = "https://github.com/bank-of-england/nowcast-midas/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Exclude files and directories
exclude = [
    ".git",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Ignore unused imports in __init__.py files

[tool.pytest.ini_options]
testpaths = ["tests"]