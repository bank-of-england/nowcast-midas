repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.3
    hooks:
      - id: ruff
        name: Run Ruff linter
        args: [--fix]
        additional_dependencies: []
        language: system  # Use the system Python environment
      - id: ruff-format
        name: Run Ruff formatter
        additional_dependencies: []
        language: system  # Use the system Python environment

  - repo: local
    hooks:
      - id: conventional-pre-commit
        name: Check Conventional Commit
        entry: conventional-pre-commit
        language: system
        stages: [commit-msg]
      - id: generate-api-docs
        name: Generate API documentation
        entry: python scripts/generate_api_docs.py
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|scripts/.*\.py|docs/api\.md)$
      - id: pydoclint
        name: Run pydoclint
        entry: pydoclint
        args: [--style=numpy, .]
        language: system
        pass_filenames: false
      - id: build-docs
        name: Build documentation
        entry: zensical build --clean --strict
        language: system
        pass_filenames: false
      - id: pytest
        name: Run pytest
        entry: pytest
        language: system
        pass_filenames: false
